[build-system]
requires = ["setuptools>=61.2", "wheel"]
build-backend = "setuptools.build_meta"


[project]
version = "500"
name = "nixt"
authors = [
    {name = "Nixt Niet", email = "nixtniet@proton.me" },
]
description = "write your own commands."
readme = "README.rst"
license = "Unlicense"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: Unix",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities"
]

[project.scripts]
"nixt" = "nixt.runtime:main"


[project.urls]
"home" = "https://github.com/nixtniet/nixt"
"bugs" = "https://github.com/nixtniet/nixt/issues"
"source" = "https://github.com/nixtniet/nixt"


[tool.setuptools]
packages = [
    'nixt',
    'nixt.minimal',
    'nixt.modules',
    'nixt.namings',
    'nixt.neurons',
    'nixt.numbers'
]


[tool.pylint."messages control"]
disable = [
    'R',
    'invalid-name',
    'line-too-long',
    'import-outside-toplevel',
    'broad-exception-caught',
    'relative-beyond-top-level'
]

[tool.ruff.lint]
preview = true
ignore = [
    'DTZ',
    'deprecated-import',
    'blind-except',
    'invalid-all-format',
    'mutable-class-default',
    'non-pep585-annotation',
    'unsorted-imports',
    'verbose-log-message'
]
